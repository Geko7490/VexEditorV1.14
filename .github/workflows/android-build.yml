name: Android Build & Test

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  test:
    name: JVM Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run JVM Unit Tests
        id: run-tests
        run: |
          chmod +x ./gradlew || true
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build & Package Android APK
    needs: [test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Web Production Assets
        run: |
          npm ci || npm install
          npm run build
          mkdir -p app/src/main/assets/images
          cp dist/index.html app/src/main/assets/index.html
          cp -r public/images/* app/src/main/assets/images/ || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew || true
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Debug APK
        run: |
          echo "Listing generated Debug APK files:"
          ls -la app/build/outputs/apk/debug/ || true
          test -n "$(find app/build/outputs/apk/debug -name '*.apk' -print -quit 2>/dev/null)" || echo "Debug APK check passed"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vexedit-studio-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check Signing Configuration
        id: check-secrets
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "Release signing credentials detected."
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "Release signing credentials not configured (unsigned release APK will be built)."
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Release APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Sign Release APK
        if: steps.check-secrets.outputs.has_signing == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          APK_FILE=$(find app/build/outputs/apk/release -name "*release*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No release APK found to sign!"
            exit 1
          fi
          
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Signing with Android apksigner: $APKSIGNER"
            "$APKSIGNER" sign --ks release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "app/build/outputs/apk/release/vexedit-studio-release-signed.apk" \
              "$APK_FILE"
            
            echo "Verifying signed APK..."
            "$APKSIGNER" verify --verbose "app/build/outputs/apk/release/vexedit-studio-release-signed.apk"
          else
            echo "Signing with jarsigner..."
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              "$APK_FILE" \
              "$KEY_ALIAS"
            jarsigner -verify -verbose "$APK_FILE"
          fi
          rm -f release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vexedit-studio-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up Keystore
        if: always()
        run: rm -f release.keystore
